<svg xmlns="http://www.w3.org/2000/svg" width="380" height="130" viewBox="0 0 190 65" fill="none">
      <!-- Heartbeat ECG line -->
      <path d="M 0 35 L 32 35 L 36 31 L 41 38 L 47 14 L 54 52 L 60 28 L 65 39 L 70 35 L 94 35" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Stethoscope tubing: from pulse line, curves smoothly into a wide lower loop -->
      <path d="M 94 35 C 108 35 120 40 125 48 C 130 56 122 61 116 57 C 110 52 113 41 123 35 C 128 31 133 26 133 18" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Binaural tubes (ear tubes) curving up -->
      <path d="M 133 18 C 133 10 125 4 120 3" stroke="#22c55e" stroke-width="2.3" stroke-linecap="round" fill="none"/>
      <path d="M 133 18 C 133 10 141 4 146 3" stroke="#22c55e" stroke-width="2.3" stroke-linecap="round" fill="none"/>
      
      <!-- Ear tips -->
      <circle cx="120" cy="3" r="2.2" fill="#22c55e"/>
      <circle cx="146" cy="3" r="2.2" fill="#22c55e"/>
      
      <!-- Stethoscope chest piece (bell) -->
      <circle cx="116" cy="57" r="5" stroke="#22c55e" stroke-width="2.4" fill="#eaf7ef"/>
    </svg>