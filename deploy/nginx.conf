# Only the sign-in page, robots.txt and sitemap.xml may be indexed; every other URL is private.
# $request_uri is the original URL, so the SPA fallback to /index.html does not hide the sign-in exception.
map $request_uri $robots_tag {
    default "noindex, nofollow";
    "~^/auth/sign-in/?(\?.*)?$" "";
    "~^/(robots\.txt|sitemap\.xml)$" "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # Server-level headers are inherited because no location below defines its own add_header (use `expires` for caching).
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Entry points and the service worker must always be revalidated.
    location = /index.html { expires -1; }
    location = /sw-learning-cache.js { expires -1; }
    location = /manifest.webmanifest { expires 1d; }

    # Hashed build output never changes for a given file name.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Unhashed images and fonts: cache for a week.
    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
